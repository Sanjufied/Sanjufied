name: Daily README Date Update

on:
  schedule:
    # Runs every day at 12:00 AM IST (midnight, Asia/Kolkata)
    - cron: '0 2 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update last updated date in README.md
        run: |
          DATE_ONLY=$(TZ=Asia/Kolkata date '+%d-%m-%Y')

          # Replace the date in the last-updated comment
          if grep -q "Last updated:" README.md; then
            sed -i "s|<!-- Last updated: .* -->|<!-- Last updated: ${DATE_ONLY} -->|" README.md
          else
            echo "<!-- Last updated: ${DATE_ONLY} -->" >> README.md
          fi

          git config user.name "Sanjufied"
          git config user.email "svsanju03@gmail.com"

          git add README.md
          if git diff --staged --quiet; then
            echo "Date already up to date — no commit needed"
          else
            git commit -m "chore: update README last updated date to ${DATE_ONLY} [skip ci]"
            git push
          fi
